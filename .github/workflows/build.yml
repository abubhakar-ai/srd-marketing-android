name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode keystore
        run: base64 -d app/r.keystore.b64 > app/r.keystore
      - name: Make icons
        run: |
          sudo apt-get install -y fonts-dejavu-core > /dev/null
          pip install pillow
          python3 tools/icon.py
          mkdir -p app/src/main/res/mipmap-nodpi app/src/main/res/drawable-nodpi
          mv ic_srd.png app/src/main/res/mipmap-nodpi/ic_srd.png
          mv ic_srd_fg.png app/src/main/res/drawable-nodpi/ic_srd_fg.png
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SRD-Marketing-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SRD-Marketing.apk
          gh release create v1-${{ github.run_number }} SRD-Marketing.apk --title "SRD Marketing APK" --notes "Android app build"
